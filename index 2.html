<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portrait Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#FFD93D; --ink:#1A1446; --card:#FFFFFF; --muted:#4B4380;
    --red:#E5233B; --blue:#2D5BFF; --good:#0E9F5B; --warn:#C77700; --bad:#D6203A;
    --pink:#FF5FA2; --orange:#FF8A1F; --mint:#19D3A2;
    --display:"Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    --body:"Source Serif 4", Georgia, serif;
    color-scheme: light; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#1B1646; --ink:#FFF4CF; --card:#2B2478; --muted:#CFC9FF;
      --red:#FF5C6C; --blue:#7C9BFF; --good:#3DDC97; --warn:#FFC53D; --bad:#FF8A98;
      --pink:#FF8CC0; --orange:#FFA94D; --mint:#3DDCB5; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper:#1B1646; --ink:#FFF4CF; --card:#2B2478; --muted:#CFC9FF;
    --red:#FF5C6C; --blue:#7C9BFF; --good:#3DDC97; --warn:#FFC53D; --bad:#FF8A98;
    --pink:#FF8CC0; --orange:#FFA94D; --mint:#3DDCB5; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.55; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 20px 18px 48px; }

  .mast { display:flex; align-items:center; gap:14px; background:var(--card); border:4px solid var(--ink); border-radius:32px; padding:14px 20px; margin-bottom:26px; box-shadow:6px 6px 0 var(--ink); }
  .mast svg { flex:none; width:56px; height:56px; }
  .mast h1 { margin:0; font-family:var(--display); font-weight:900; font-size:clamp(2.4rem,8vw,3.8rem); line-height:.9; }
  .mast p { margin:4px 0 0; color:var(--muted); font-size:1rem; line-height:1.3; }

  .grid { display:grid; gap:26px; }
  @media (min-width:900px) { .grid { grid-template-columns:minmax(320px,420px) 1fr; align-items:start; } .left { margin:0 auto; width:100%; } }

  .frame { position:relative; aspect-ratio:var(--ar,4/5); width:min(100%, calc(62vh * var(--r,.8))); margin:0 auto; overflow:hidden; border:4px solid var(--ink); border-radius:28px; background:var(--card); box-shadow:6px 6px 0 var(--ink); }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s ease; }
  @media (prefers-reduced-motion: reduce) { .frame img { transition:none; } }
  .tag { position:absolute; top:0; left:0; z-index:2; background:var(--pink); color:var(--ink); font-family:var(--display); font-weight:800; font-size:1.1rem; padding:4px 14px; border-bottom-right-radius:18px; }
  .steps { position:absolute; bottom:10px; left:0; right:0; z-index:2; display:flex; justify-content:center; gap:6px; }
  .steps i { width:12px; height:12px; border-radius:50%; background:#fff; border:2px solid var(--ink); }
  .steps i.on { background:var(--red); }

  .panel { background:var(--card); border:4px solid var(--ink); border-radius:32px; padding:24px 22px; box-shadow:6px 6px 0 var(--ink); }
  .panel h2 { font-family:var(--display); font-weight:800; font-size:1.8rem; margin:0 0 4px; line-height:1.1; }
  .hint { margin:0 0 12px; color:var(--muted); font-size:.95rem; }
  .step { margin:0 0 26px; }

  .btn { border:3px solid var(--ink); background:var(--card); border-radius:999px; padding:10px 20px; cursor:pointer; font-family:var(--display); font-weight:800; font-size:1.25rem; }
  .btn.solid { background:var(--blue); border-color:var(--blue); color:#fff; }
  .btn[disabled] { opacity:.4; cursor:not-allowed; }
  .go { width:100%; border:0; border-radius:999px; background:linear-gradient(90deg,var(--red),var(--orange)); color:#fff; font-family:var(--display); font-weight:900; font-size:1.7rem; padding:14px; cursor:pointer; box-shadow:0 5px 0 var(--ink); }
  .row-btns { display:flex; flex-wrap:wrap; gap:10px; }

  .yearbox { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .yearnum { font-family:var(--display); font-weight:900; font-size:3.6rem; line-height:1; min-width:4.4ch; text-align:center; color:var(--red); }
  .nudge { min-width:48px; height:48px; padding:0 10px; border:3px solid var(--ink); border-radius:24px; background:color-mix(in srgb,var(--mint) 35%,var(--card)); font-family:var(--display); font-weight:900; font-size:1.3rem; cursor:pointer; }
  input[type=range] { width:100%; accent-color:var(--red); height:36px; margin-top:8px; }
  .scale { display:flex; justify-content:space-between; color:var(--muted); font-size:.85rem; }

  .text { width:100%; border:3px solid var(--ink); border-radius:18px; background:var(--card); padding:12px 14px; font-size:1.15rem; margin-bottom:12px; }
  .msg { min-height:1.5em; margin:8px 0 0; font-weight:600; }
  .msg.bad { color:var(--bad); } .msg.good { color:var(--good); }

  .total { display:flex; align-items:baseline; gap:10px; border-bottom:4px solid var(--ink); padding-bottom:8px; margin-bottom:14px; }
  .total .n { font-family:var(--display); font-weight:900; font-size:4.6rem; line-height:.9; color:var(--red); }
  .total .of { font-family:var(--display); font-weight:800; font-size:1.7rem; color:var(--muted); }
  .rows { list-style:none; margin:0 0 16px; padding:0; display:grid; gap:8px; }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:center; background:color-mix(in srgb,var(--blue) 7%,var(--card)); border:2px solid var(--ink); border-radius:18px; padding:10px 14px; }
  .row b { font-family:var(--display); font-weight:800; font-size:1.2rem; }
  .row span { display:block; font-size:.95rem; }
  .row .pts { font-family:var(--display); font-weight:900; font-size:1.5rem; white-space:nowrap; }
  .reveal h3 { font-family:var(--display); font-weight:900; font-size:2.4rem; margin:14px 0 0; line-height:1; }
  .chip { display:inline-block; border:2px solid var(--ink); border-radius:999px; padding:3px 14px; margin:8px 0; background:color-mix(in srgb,var(--pink) 30%,var(--card)); font-size:.95rem; }
  .meta { color:var(--muted); font-size:.92rem; margin:12px 0 0; }
  .share textarea { width:100%; border:2px solid var(--ink); border-radius:14px; padding:10px; background:var(--card); font:inherit; resize:none; }
  .note { margin-top:26px; border-top:2px solid var(--ink); padding-top:12px; color:var(--muted); font-size:.9rem; }
  .combo ul { list-style:none; margin:8px 0 0; padding:0; border:3px solid var(--ink); border-radius:18px; background:var(--card); max-height:230px; overflow-y:auto; }
  .combo li button { width:100%; text-align:left; background:none; border:0; border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent); padding:12px 14px; cursor:pointer; font-size:1.05rem; }
  .combo li:last-child button { border-bottom:0; }
  .combo li button:hover { background:color-mix(in srgb,var(--blue) 14%,transparent); }
  .combo .none { padding:12px 14px; color:var(--muted); }
  .picked { margin:8px 0 0; color:var(--good); font-weight:600; min-height:1.4em; }
  .wrongs { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 14px; }
  .wrong { border:2px solid var(--ink); border-radius:999px; padding:2px 12px; background:color-mix(in srgb,var(--red) 18%,var(--card)); text-decoration:line-through; font-size:.95rem; }

  /* ---- hot pink, yellow and teal ---- */
  :root {
    --paper:#FFF4C9; --ink:#10303A; --card:#FFFFFF; --muted:#44646B;
    --red:#F01A86; --blue:#0A7F7D; --pink:#FFD23F; --orange:#FF7AB8; --mint:#2BC4B8;
    --good:#0B7F6F; --warn:#B87400; --bad:#C4143A; --deep:#0A6F73;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#0D2428; --ink:#FFF6DB; --card:#153A3F; --muted:#B9DAD6;
      --red:#FF4FA3; --blue:#2BD1C4; --pink:#FFD84D; --orange:#FF8EC4; --mint:#2BD1C4;
      --good:#4FE0B6; --warn:#FFC53D; --bad:#FF8A98; --deep:#0A6F73;
    }
  }
  :root[data-theme="dark"] {
    --paper:#0D2428; --ink:#FFF6DB; --card:#153A3F; --muted:#B9DAD6;
    --red:#FF4FA3; --blue:#2BD1C4; --pink:#FFD84D; --orange:#FF8EC4; --mint:#2BD1C4;
    --good:#4FE0B6; --warn:#FFC53D; --bad:#FF8A98; --deep:#0A6F73;
  }

  .mast { background:linear-gradient(100deg,#00C9BB,#12E3D0); color:#08272E; border:0; border-radius:28px; box-shadow:0 10px 30px rgba(16,48,58,.2); position:relative; overflow:hidden; }
  .mast::before { content:""; position:absolute; right:-34px; top:-44px; width:150px; height:150px; border-radius:50%; background:#FFD23F; }
  .mast::after { content:""; position:absolute; right:70px; bottom:-48px; width:90px; height:90px; border-radius:50%; background:#F01A86; }
  .mast > * { position:relative; z-index:1; }
  .mast h1 { color:#08272E; }
  .mast p { color:#0B3B42; }
  .mast svg { color:#08272E; }

  .frame { border:3px solid var(--ink); border-radius:26px; box-shadow:0 12px 28px rgba(16,48,58,.22); }
  .tag { background:var(--pink); color:#10303A; }
  .steps i { border-color:var(--ink); }
  .steps i.on { background:var(--red); }

  .panel { border:0; border-top:8px solid var(--red); border-radius:28px; box-shadow:0 12px 32px rgba(16,48,58,.15); }
  .panel h2 { display:flex; align-items:center; gap:10px; }
  .panel h2::before { content:""; flex:none; width:10px; height:1em; border-radius:5px; background:var(--pink); }

  .btn { border:2px solid var(--ink); }
  .btn.solid { background:var(--deep); border-color:var(--deep); color:#fff; }
  .go { background:var(--red); color:#fff; box-shadow:0 6px 0 #B30F63; }
  .go[disabled] { opacity:.45; cursor:not-allowed; box-shadow:none; }

  .text { border:2px solid var(--ink); border-radius:16px; }
  .text:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 4px color-mix(in srgb, var(--red) 25%, transparent); }
  .combo ul { border:2px solid var(--ink); }
  .combo li button:hover { background:color-mix(in srgb, var(--pink) 45%, transparent); }
  .yearnum { font-size:4rem; color:var(--red); text-align:center; }
  input[type=range] { accent-color:var(--red); }

  .total { border-bottom:5px solid var(--pink); }
  .total .n { color:var(--red); }
  .row { border:0; border-left:8px solid var(--mint); border-radius:16px; background:color-mix(in srgb, var(--mint) 14%, var(--card)); }
  .chip { border:0; background:var(--pink); color:#10303A; font-weight:600; }
  .wrong { border:0; background:color-mix(in srgb, var(--red) 20%, var(--card)); }
  .note { border-top:2px solid color-mix(in srgb, var(--ink) 25%, transparent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="32" r="12" style="fill:var(--red)"/><circle cx="32" cy="32" r="4" fill="currentColor"/></svg>
    <div><h1>Portrait Game</h1><p>One portrait a day. Zoom out to guess the job, date it, then name the sitter.</p></div>
  </header>
  <div id="app"></div>
  <p class="note">Prototype. Portrait details are placeholders until confirmed with the gallery.</p>
</div>

let t, entry, mode, S;
function freshRound() { return { stage: "prof", level: 0, guesses: [], profPts: 0, profOK: false, year: 1800, datePts: 0, who: 0, tries: 0 }; }

function start(newMode) {
  t = todayInfo(); entry = entryFor(t); mode = newMode; S = freshRound();
  if (mode === "daily") { const st = load(); if (st.day === t.num && st.round && st.round.stage === "done") S = st.round; }
  render(); window.scrollTo({ top: 0 });
}

/* ---------- scoring ---------- */
const dateScore = g => { const d = Math.abs(g - entry.year); return d <= 2 ? 50 : Math.round(50 * Math.exp(-d / 25)); };
const total = () => S.profPts + S.datePts + S.who;
function lev(a, b) {
  const d = []; for (let i = 0; i <= a.length; i++) d[i] = [i];
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
/* up to two spelling mistakes are forgiven (one for very short names) */
function nameOK(g) {
  return [entry.sitter].concat(entry.aliases).map(norm).some(n => lev(g, n) <= (n.length >= 5 ? 2 : n.length >= 3 ? 1 : 0));
}

/* ---------- render ---------- */
function frameHTML() {
  const done = S.stage === "done", sc = done ? 1 : SCALES[S.level];
  const dots = SCALES.map((_, i) => `<i class="${done || i <= S.level ? "on" : ""}"></i>`).join("");
  return `<div class="left"><div class="frame" style="--ar:${entry.ratio || "4/5"};--r:${RNUM()}"><span class="tag">${mode === "daily" ? "No. " + (t.num - EPOCH_DAY + 1) : "Practice"}</span>
    <img id="pic" src="${entry.image || PLACEHOLDER}" alt="${done ? "Portrait of " + entry.sitter : "A portrait, partly hidden"}" style="transform-origin:0 0;transform:${tf(sc)}">
    <div class="steps" aria-hidden="true">${dots}</div></div></div>`;
}
function render() {
  $("#app").innerHTML = `<div class="grid">${frameHTML()}<div class="panel" id="panel"></div></div>`;
  ({ prof: viewProf, date: viewDate, who: viewWho, done: viewDone })[S.stage]();
}
function setZoom(l) {
  S.level = l;
  $("#pic").style.transform = tf(SCALES[l]);
  document.querySelectorAll(".steps i").forEach((d, i) => d.classList.toggle("on", i <= l));
  const b = $("#out"), last = l >= SCALES.length - 1;
  if (b) { b.disabled = last; b.textContent = last ? "Fully zoomed out" : "Zoom out (" + (SCALES.length - 1 - l) + " left)"; }
  const p = $("#pts"); if (p) p.textContent = "A right answer now scores " + PROF_PTS[l] + " points.";
}

/* step 1: profession, picked from a searchable list */
function viewProf() {
  $("#panel").innerHTML = `
    <div class="step"><h2>What do they do?</h2>
      <p class="hint">Search the list and tap a profession. Zooming out gives you more clues, and every wrong guess zooms out one step too. The earlier you are right, the more you score.</p>
      <button class="btn solid" id="out"></button>
      <p class="hint" id="pts" style="margin-top:10px"></p>
      <div class="wrongs" id="wrongs"></div>
      <div class="combo"><input class="text" id="pf" type="text" autocomplete="off" placeholder="Search professions" aria-label="Search professions" style="margin-bottom:0"><ul id="opts" hidden></ul></div>
      <p class="picked" id="chosen"></p>
      <div class="step" style="margin-top:22px"><h2>When was it made?</h2>
        <p class="hint">Worth up to 50 points, and within two years is full marks. Your date counts when your profession round ends.</p>
        <div class="yearnum" id="yn" aria-live="polite">${S.year}</div>
        <input type="range" id="yr" min="${MIN_YEAR}" max="${MAX_YEAR}" value="${S.year}" aria-label="Year">
        <div class="scale"><span>${MIN_YEAR}</span><span>${MAX_YEAR}</span></div></div>
      <button class="go" id="lock" disabled>Lock in my guess</button>
      <p class="msg" id="msg" role="alert"></p></div>`;
  setZoom(S.level);
  let pick = null;
  const setYear = v => { S.year = Math.min(MAX_YEAR, Math.max(MIN_YEAR, v)); $("#yr").value = S.year; $("#yn").textContent = S.year; };
  $("#yr").oninput = e => setYear(parseInt(e.target.value, 10));
  const input = $("#pf"), list = $("#opts"), lock = $("#lock");
  const wrongs = () => { $("#wrongs").innerHTML = S.guesses.map(g => `<span class="wrong">${g}</span>`).join(""); };
  const draw = () => {
    const q = norm(input.value);
    const items = PROFESSIONS.filter(p => S.guesses.indexOf(p) === -1 && (!q || norm(p).indexOf(q) !== -1));
    list.innerHTML = items.length ? items.map((p, i) => `<li><button type="button" data-i="${i}">${p}</button></li>`).join("") : '<li class="none">No match. Try another word.</li>';
    list.querySelectorAll("button").forEach(b => b.onclick = () => {
      pick = items[parseInt(b.dataset.i, 10)]; input.value = pick; list.hidden = true;
      $("#chosen").textContent = "Chosen: " + pick; lock.disabled = false;
    });
    list.hidden = false;
  };
  input.onfocus = draw; input.onclick = draw;
  input.oninput = () => { pick = null; lock.disabled = true; $("#chosen").textContent = ""; draw(); };
  $("#panel").onclick = e => { if (!e.target.closest(".combo")) list.hidden = true; };
  $("#out").onclick = () => setZoom(Math.min(S.level + 1, SCALES.length - 1));
  wrongs();
  lock.onclick = () => {
    if (!pick) return;
    if (pick === entry.profession || entry.alsoProfessions.indexOf(pick) !== -1) {
      S.profPts = PROF_PTS[S.level]; S.profOK = true; S.datePts = dateScore(S.year); S.stage = "who"; render();
    } else {
      S.guesses.push(pick);
      if (S.level >= SCALES.length - 1) { S.profPts = 0; S.datePts = dateScore(S.year); S.stage = "who"; render(); return; }
      setZoom(S.level + 1); wrongs();
      input.value = ""; pick = null; lock.disabled = true; list.hidden = true; $("#chosen").textContent = "";
      $("#msg").className = "msg bad"; $("#msg").textContent = "Not that one. The portrait zooms out a step.";
    }
  };
}

/* step 2: the date */
function viewDate() {
  $("#panel").innerHTML = `
    <div class="step"><h2>${S.profOK ? "Profession: right" : "Profession: not this time"}</h2>
      <p class="hint">${S.profOK ? "That is " + S.profPts + " points." : "It was " + entry.profession + "."}</p></div>
    <div class="step"><h2>When was it made?</h2>
      <p class="hint">Worth up to 50 points. Within two years is full marks.</p>
      <div class="yearbox"><button class="nudge" data-d="-10">-10</button><button class="nudge" data-d="-1">-1</button>
        <div class="yearnum" id="yn" aria-live="polite">${S.year}</div>
        <button class="nudge" data-d="1">+1</button><button class="nudge" data-d="10">+10</button></div>
      <input type="range" id="yr" min="${MIN_YEAR}" max="${MAX_YEAR}" value="${S.year}" aria-label="Year">
      <div class="scale"><span>${MIN_YEAR}</span><span>${MAX_YEAR}</span></div></div>
    <button class="go" id="lock">Lock in my date</button>`;
  const setYear = v => { S.year = Math.min(MAX_YEAR, Math.max(MIN_YEAR, v)); $("#yr").value = S.year; $("#yn").textContent = S.year; };
  $("#yr").oninput = e => setYear(parseInt(e.target.value, 10));
  document.querySelectorAll(".nudge").forEach(b => b.onclick = () => setYear(S.year + parseInt(b.dataset.d, 10)));
  $("#lock").onclick = () => { S.datePts = dateScore(S.year); S.stage = "who"; render(); };
}

/* step 3: extra credit, the name */
function viewWho() {
  $("#panel").innerHTML = `
    <div class="step"><h2>Main game done</h2><p class="hint">You have ${S.profPts + S.datePts} out of 100 so far.${S.profOK ? "" : " The profession was " + entry.profession + "."}</p></div>
    <div class="step"><h2>Extra: who is it?</h2>
      <p class="hint">Worth 20 points on the first try and 10 on the second. Small spelling mistakes are forgiven.</p>
      <input class="text" id="who" type="text" autocomplete="off" autocapitalize="words" placeholder="Type the sitter's name" aria-label="Sitter's name">
      <div class="row-btns"><button class="btn solid" id="guess">Guess</button><button class="btn" id="skip">Skip and reveal</button></div>
      <p class="msg" id="msg" role="alert"></p></div>`;
  const check = () => {
    const g = norm($("#who").value); if (!g) return;
    S.tries++;
    if (nameOK(g)) { S.who = S.tries === 1 ? 20 : 10; finish(); }
    else if (S.tries >= 2) finish();
    else { $("#msg").className = "msg bad"; $("#msg").textContent = "Not quite. One more try."; $("#who").value = ""; }
  };
  $("#guess").onclick = check;
  $("#who").onkeydown = e => { if (e.key === "Enter") check(); };
  $("#skip").onclick = finish;
}

function finish() {
  S.stage = "done";
  if (mode === "daily") {
    const st = load();
    const streak = st.day === t.num - 1 ? (st.streak || 0) + 1 : (st.day === t.num ? st.streak || 1 : 1);
    save({ day: t.num, round: S, streak, best: Math.max(st.best || 0, streak) });
  }
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
}

function viewDone() {
  const st = load(), diff = Math.abs(S.year - entry.year);
  const whoText = S.who === 20 ? "Right first time" : S.who === 10 ? "Right on the second try" : "Not this time";
  $("#panel").innerHTML = `<div class="reveal">
    <div class="total"><span class="n">${total()}</span><span class="of">out of 120</span></div>
    <p class="hint">Main game ${S.profPts + S.datePts}/100, extra ${S.who}/20.</p>
    <ul class="rows">
      <li class="row"><div><b>Profession</b><span>${S.profOK ? "Right at zoom step " + (S.level + 1) + " of " + SCALES.length + "." : "Not this time. It was " + entry.profession + "."}</span></div><div class="pts">${S.profPts}/50</div></li>
      <li class="row"><div><b>Date</b><span>You said ${S.year}. It is ${entry.year}${diff === 0 ? ", spot on" : " (" + diff + (diff === 1 ? " year" : " years") + " out)"}.</span></div><div class="pts">${S.datePts}/50</div></li>
      <li class="row"><div><b>Extra: who</b><span>${whoText}.</span></div><div class="pts">${S.who}/20</div></li></ul>
    <h3>${entry.sitter}</h3><span class="chip">${entry.profession}, ${entry.year}</span>
    <p>${entry.blurb}</p>
    ${entry.link ? `<p><a href="${entry.link}" target="_blank" rel="noopener">See this portrait in the collection</a></p>` : ""}
    <p class="meta">${entry.credit}</p>
    <div class="row-btns" style="margin-top:14px">
      ${mode === "daily" ? `<button class="btn solid" id="copy">Copy my result</button>` : `<button class="btn solid" id="today">Back to today</button>`}
      <button class="btn" id="prac">Practise again</button></div>
    <div class="share" id="share"></div><p class="meta" id="cd"></p></div>`;
  $("#prac").onclick = () => start("practice");
  if ($("#today")) $("#today").onclick = () => start("daily");
  if ($("#copy")) $("#copy").onclick = copyResult;
  if (mode === "daily") {
    const tick = () => {
      const n = new Date(), nx = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1), ms = nx - n;
      const el = $("#cd"); if (!el) return clearInterval(window.__cd);
      el.textContent = "Streak: " + (st.streak || 1) + ((st.streak || 1) === 1 ? " day" : " days") + ". Best: " + (st.best || 1) + ". Next portrait in " +
        Math.floor(ms / 3600000) + "h " + Math.floor(ms % 3600000 / 60000) + "m " + Math.floor(ms % 60000 / 1000) + "s.";
    };
    clearInterval(window.__cd); tick(); window.__cd = setInterval(tick, 1000);
  }
}

function copyResult() {
  const sq = (p, m) => p >= m ? "\uD83D\uDFE9" : p > 0 ? "\uD83D\uDFE8" : "\uD83D\uDFE5";
  const text = "Portrait Game No. " + (t.num - EPOCH_DAY + 1) + ": " + total() + "/120\n" + sq(S.profPts, 50) + sq(S.datePts, 50) + sq(S.who, 20) + "  (job, date, name)";
  const box = $("#share");
  const fallback = () => { box.innerHTML = '<textarea rows="3" readonly aria-label="Your result">' + text + "</textarea>"; const a = box.querySelector("textarea"); a.focus(); a.select(); };
  try { navigator.clipboard.writeText(text).then(() => { box.innerHTML = '<p class="meta">Copied to your clipboard.</p>'; }, fallback); } catch (e) { fallback(); }
}

start("daily");
</script>
</body>
</html>
